# Netlify build configuration — https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Supabase Auth (email login). These are the project URL and the PUBLISHABLE
  # key, which are public by design: they are shipped to every browser, and
  # access is controlled by Supabase Auth + Row Level Security. Never add the
  # secret / service_role key here. Values set in the Netlify UI override these.
  VITE_SUPABASE_URL = "https://wfgcnwsfftjsgqtcwlyd.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_iEe8hTQ9fdIOsSSJe1KJIw_PXj0IMN7"

# Long-lived caching for fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Data files change when the dataset is updated, so revalidate them.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
